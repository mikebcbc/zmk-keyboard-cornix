## use ws2812-spi
CONFIG_SPI=y
#CONFIG_WS2812_STRIP=y
CONFIG_LED_STRIP=y
CONFIG_ZMK_EXT_POWER=y

CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_WS2812=y
CONFIG_RGBLED_WIDGET_LED_COUNT=2

CONFIG_RGBLED_WIDGET_BRIGHTNESS=64
# Turn off the WS2812 power rail 1 second after the indicators become idle.
CONFIG_RGBLED_WIDGET_EXT_POWER_TIMEOUT_MS=1000

CONFIG_RGBLED_WIDGET_LED_SHARING=y

# Persistent layer color indication
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_LAYER_LED_INDEX=1
# Reduce debounce so mo-layer release clears the LED immediately (not on next activity)
CONFIG_RGBLED_WIDGET_LAYER_DEBOUNCE_MS=0
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=0
# Function layer is red
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=1
# Gaming layer is yellow
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=3
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_6_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_7_COLOR=0
